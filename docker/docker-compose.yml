services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-wahide:latest}
    container_name: ${CONTAINER_NAME:-wahide_backend}
    deploy:
      resources:
        limits:
          cpus: ${CPUS:-2.0}
          memory: ${MEMORY_LIMIT:-2048M}
    restart: always
    ports:
      - "${HOST_IP:-0.0.0.0}:${WEB_HTTP_PORT:-3030}:3030"
      - "${HOST_IP:-0.0.0.0}:${METRICS_PORT:-8081}:8081"
    volumes:
      # Persistent SQLite WhatsApp Sessions di disk aaPanel VPS (Anti-Logout saat Redeploy)
      - ${APP_PATH:-../}data:/app/data
      # File Konfigurasi Aplikasi dari aaPanel directory
      - ${APP_PATH:-../}config.json:/app/config.json:ro
    environment:
      - TZ=${TZ:-Asia/Jakarta}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3030 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      createdBy: "bt_apps"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"