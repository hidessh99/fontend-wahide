name: Dockerize Next.js App

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Push GHCR Container
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/fontwahide
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/fontwahide:latest
          cache-to: type=gha,mode=max

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Automated Next.js 16 Docker build release for commit ${{ github.sha }}
            
            Docker Image:
            - ghcr.io/${{ github.repository_owner }}/fontwahide:latest
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Delete old package versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'fontwahide'
          package-type: 'container'
          min-versions-to-keep: 3
          delete-only-untagged-versions: 'true'
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
